X4C_ARCH  := rv32im
X4C_BUILD := rockey

##
## 我们总是使用这个锁定的版本编译我们的程序 ...
##
X4C_BUILD_CROSS := /Machine/ATOMIC/rv32im-atomic-rockey/bin/rv32im-atomic-rockey-

##
##
##
ifeq ("$(E)","1")
X4C_TOOLCHAIN_CFLAGS	?= -Wall -Werror 
X4C_TOOLCHAIN_CXXFLAGS	?= -Wall -Werror 
else
X4C_TOOLCHAIN_CFLAGS	?= -Wall
X4C_TOOLCHAIN_CXXFLAGS	?= -Wall
endif

ifeq ("$(R)$(BT)","10")
X4C_TOOLCHAIN_CFLAGS	+= -fomit-frame-pointer
X4C_TOOLCHAIN_CXXFLAGS	+= -fomit-frame-pointer
endif

X4C_CC    ?= $(X4C_BUILD_CROSS)gcc
X4C_CXX   ?= $(X4C_BUILD_CROSS)g++
X4C_AR    ?= $(X4C_BUILD_CROSS)ar
X4C_LD    ?= $(X4C_BUILD_CROSS)g++
X4C_ASM   ?= $(X4C_BUILD_CROSS)gcc

##
## 显式钉住 ISA/ABI, 不再依赖工具链的 configure 默认值 ...
## - 我们只实现 **RV32IM** (解释器既没有 A 也没有 C) ...
## - 若不钉: 默认值一旦随工具链重建变成 rv32imac, 构建会**静默产出 C 指令**,
##   而 VM 假设"取指 4 字节 + pc&3 对齐" => 会静默错乱 ...
## - 将来真要开 A/C, 这里是唯一的开关点, 且必须与 VM 的能力同步 ...
##
X4C_TOOLCHAIN_CFLAGS   += -march=rv32im -mabi=ilp32
X4C_TOOLCHAIN_CXXFLAGS += -march=rv32im -mabi=ilp32

X4C_TOOLCHAIN_LDEXEFLAGS += -nostartfiles -Wl,-nostdlib -nostdlib
X4C_TOOLCHAIN_LDDLLFLAGS += -nostartfiles -Wl,-nostdlib -nostdlib
X4C_TOOLCHAIN_CFLAGS     += -ffreestanding -ffunction-sections -fdata-sections -fvisibility=hidden
X4C_TOOLCHAIN_CXXFLAGS   += -ffreestanding -ffunction-sections -fdata-sections -fvisibility=hidden -fvisibility-inlines-hidden

##
##
##
X4C_COMMON_LDFLAGS += -nostartfiles -Wl,-nostdlib -nostdlib  -Wl,--cref -Wl,--gc-section

##
##
##
X4C_RELEASE_CFLAGS   ?= -O1 -Os -g -DNDEBUG
X4C_RELEASE_CXXFLAGS ?= -O1 -Os -g -DNDEBUG

##
##
##
X4C_TOOLCHAIN_CFLAGS   += -std=c17 -Wunused -Wuninitialized -Wextra -march=rv32im -mabi=ilp32
X4C_TOOLCHAIN_CXXFLAGS += -std=c++17 -fno-rtti -fno-exceptions -fno-use-cxa-atexit -march=rv32im -mabi=ilp32

##
##
##
ifeq ("$(rLANG_CONFIG_ENABLE_ATOMC_WORLD)","1")
##
## 严格模式, 结果以解释器的执行结果为准, 通常为调用物理ukey的 LIMIT.op_HYPER() 做准备 ...
##
X4C_BOARD := atomic
X4C_TOOLCHAIN_CFLAGS   += -DrLANG_CONFIG_ENABLE_ATOMC_WORLD=1
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_CONFIG_ENABLE_ATOMC_WORLD=1
X4C_TOOLCHAIN_ASFLAGS  += -DrLANG_CONFIG_ENABLE_ATOMC_WORLD=1
else  ## rLANG_CONFIG_ENABLE_ATOMC_WORLD == 1
##
## 未定义 rLANG_CONFIG_ENABLE_ATOMC_WORLD=1 则视作 rLANG_CONFIG_ENABLE_COSMO_WORLD
##
## 非严格模式下, 我们通常将代码转译到主机二进制程序执行, 性能更高, 但不能调用物理ukey的 LIMIT.op_HYPER() ...
##
X4C_TOOLCHAIN_CFLAGS   += -DrLANG_CONFIG_ENABLE_COSMO_WORLD=1
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_CONFIG_ENABLE_COSMO_WORLD=1
X4C_TOOLCHAIN_ASFLAGS  += -DrLANG_CONFIG_ENABLE_COSMO_WORLD=1
endif ## rLANG_CONFIG_ENABLE_ATOMC_WORLD == 1

##
##
##
rLANG_COMMON_STRICT_CFLAGS   += -D__rLANG_CONFIG_STRICT_MODE__
rLANG_COMMON_STRICT_CXXFLAGS += -D__rLANG_CONFIG_STRICT_MODE__
rLANG_COMMON_STRICT_CFLAGS   += -Wshadow -Wfloat-equal -Wstrict-aliasing -Wmaybe-uninitialized -Waddress -Wdiscarded-qualifiers
rLANG_COMMON_STRICT_CXXFLAGS += -Wshadow -Wfloat-equal -Wstrict-aliasing -Wmaybe-uninitialized -Waddress

##
## 注入一点点微不足道的熵并破坏所有的不同编译版本间兼容性的任何约定 ...
##
X4C_TOOLCHAIN_CFLAGS += -DrLANG_WORLD_SEED_0=$(rLANG_WORLD_SEED_0)
X4C_TOOLCHAIN_CFLAGS += -DrLANG_WORLD_SEED_1=$(rLANG_WORLD_SEED_1)
X4C_TOOLCHAIN_CFLAGS += -DrLANG_WORLD_SEED_2=$(rLANG_WORLD_SEED_2)
X4C_TOOLCHAIN_CFLAGS += -DrLANG_WORLD_SEED_3=$(rLANG_WORLD_SEED_3)
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_WORLD_SEED_0=$(rLANG_WORLD_SEED_0)
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_WORLD_SEED_1=$(rLANG_WORLD_SEED_1)
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_WORLD_SEED_2=$(rLANG_WORLD_SEED_2)
X4C_TOOLCHAIN_CXXFLAGS += -DrLANG_WORLD_SEED_3=$(rLANG_WORLD_SEED_3)

##
## ld <input> <output> <ldflags>
##
ifeq ("$(origin x4c-cmd-ld)","undefined")
define x4c-cmd-ld
$2 : $$($(strip $1))
	$$(info LD $$@)
	$$(hide) $$(X4C_LD) -o $$@ $$($(strip $1)) $$($(strip $3)) $$(LIBX4C_EXT_LDFLAGS) -Wl,-Map -Wl,$$@.map
endef
endif

